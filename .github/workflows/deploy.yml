name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  test:
    name: Run Linting & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Black code format check
        run: black --check .

      - name: Run isort import order check
        run: isort --check-only .

      - name: Run Flake8 linter
        run: flake8

      - name: Run Pytest test suite
        run: pytest

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting automated deployment for release..."
            cd /home/ubuntu/transaction-webhook-service
            git fetch origin --tags
            git fetch origin main
            git reset --hard origin/main
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python manage.py migrate
            sudo systemctl restart transaction-web transaction-worker
            sleep 2
            echo "🩺 Verifying health endpoint..."
            curl -f http://127.0.0.1/
            echo "✅ Release deployment successful and verified healthy!"
